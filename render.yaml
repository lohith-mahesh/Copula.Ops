services:
  - type: web
    name: copula-ops
    runtime: python
    plan: starter 
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT --timeout 150
    disk:
      name: market-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: RENDER
        value: "true"
