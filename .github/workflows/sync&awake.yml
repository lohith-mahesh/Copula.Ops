name: Sync and Keep Awake

on:
  push:
    branches: [main]
  schedule:
    # Runs every 6 hours to keep the terminal alive
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Keep Space Awake
        run: curl -I https://lohithmahesh-copula-ops.hf.space/

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://lohithmahesh:$HF_TOKEN@huggingface.co/spaces/lohithmahesh/copula-ops main
